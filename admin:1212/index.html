<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Lumenno</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../../assets/emblem.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14170F; --surface:#1B2015; --surface-2:#232A1B; --panel:#1E2417;
    --text:#EDE8D8; --text-soft:#A8A38E; --heading:#E7DFC4;
    --herb:#5E7C4A; --herb-fixed:#333F27; --gold:#C9A227; --gold-light:#E4C660;
    --on-accent:#F7F3EA; --ink-fixed:#2B2A22; --border-soft:rgba(231,223,196,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:'Jost',sans-serif; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  h1,h2{font-family:'Cormorant Garamond',serif; font-weight:500; color:var(--heading); margin:0;}
  .card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:6px;
    padding:40px 34px; max-width:380px; width:100%; text-align:center;
  }
  .emblem{width:56px; height:56px; margin:0 auto 20px; display:block;}
  .card h1{font-size:28px; margin-bottom:8px;}
  .card p{color:var(--text-soft); font-size:14px; margin-bottom:26px;}
  input{
    width:100%; background:var(--panel); border:1px solid var(--border-soft); color:var(--text);
    padding:13px 14px; border-radius:4px; font-family:'Jost',sans-serif; font-size:15px; text-align:center;
    letter-spacing:2px;
  }
  input:focus{outline:2px solid var(--herb); outline-offset:1px;}
  button.primary{
    width:100%; margin-top:16px; background:var(--herb); color:var(--on-accent); border:none;
    padding:13px; border-radius:4px; font-size:14px; letter-spacing:.5px; cursor:pointer;
  }
  .error{color:#D98A7A; font-size:13px; margin-top:14px; min-height:18px;}

  #dashboard{display:none; width:100%; max-width:1000px;}
  .dash-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; flex-wrap:wrap; gap:12px;}
  .dash-header h1{font-size:26px;}
  .actions{display:flex; gap:10px;}
  .btn-sm{
    background:transparent; border:1px solid var(--border-soft); color:var(--text-soft);
    padding:9px 16px; border-radius:4px; font-size:13px; cursor:pointer;
  }
  .btn-sm:hover{border-color:var(--herb); color:var(--text);}
  .orders-list{display:flex; flex-direction:column; gap:14px;}
  .order-card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:6px; padding:20px 22px;
  }
  .order-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:10px; flex-wrap:wrap;}
  .order-name{font-family:'Cormorant Garamond',serif; font-size:20px; color:var(--heading);}
  .order-total{font-family:'Cormorant Garamond',serif; font-size:20px; color:var(--gold-light);}
  .badge{
    font-size:11px; letter-spacing:.5px; text-transform:uppercase; padding:3px 10px; border-radius:999px; font-weight:600;
  }
  .badge.paid{background:var(--herb); color:var(--on-accent);}
  .badge.pending{background:rgba(201,162,39,0.25); color:var(--gold-light);}
  .badge.failed{background:rgba(217,138,122,0.2); color:#D98A7A;}
  .order-meta{font-size:13px; color:var(--text-soft); line-height:1.7;}
  .order-meta b{color:var(--text);}
  .order-items{margin-top:10px; padding-top:10px; border-top:1px solid var(--border-soft); font-size:13px; color:var(--text-soft);}
  .order-items li{margin-bottom:2px;}
  .empty{text-align:center; color:var(--text-soft); padding:60px 0;}
</style>
</head>
<body>

<div class="card" id="loginCard">
  <svg class="emblem" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="100" r="96" fill="none" stroke="#C9A227" stroke-width="3"/>
    <g fill="#5E7C4A">
      <path d="M100 150 L100 62" stroke="#5E7C4A" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M100 128 C88 118,76 116,64 122 C72 132,84 134,100 128Z"/>
      <path d="M100 128 C112 118,124 116,136 122 C128 132,116 134,100 128Z"/>
      <path d="M100 104 C90 95,80 93,70 98 C77 107,88 109,100 104Z"/>
      <path d="M100 104 C110 95,120 93,130 98 C123 107,112 109,100 104Z"/>
    </g>
    <circle cx="100" cy="58" r="5" fill="#C9A227"/>
  </svg>
  <h1>Painel Lumenno</h1>
  <p>Digite a senha pra ver os pedidos.</p>
  <input type="password" id="passwordInput" placeholder="Senha" autofocus>
  <button class="primary" id="loginBtn">Entrar</button>
  <div class="error" id="loginError"></div>
</div>

<div id="dashboard">
  <div class="dash-header">
    <h1>Pedidos</h1>
    <div class="actions">
      <button class="btn-sm" id="refreshBtn">Atualizar</button>
      <button class="btn-sm" id="logoutBtn">Sair</button>
    </div>
  </div>
  <div class="orders-list" id="ordersList"></div>
</div>

<script>
const FUNCTION_URL = 'https://wupkihqqcxlmgyjgfqwq.supabase.co/functions/v1/admin-orders';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1cGtpaHFxY3hsbWd5amdmcXdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MzAxNDQsImV4cCI6MjA5OTEwNjE0NH0.34WLNmTV8tHHiIHskeTKpnecUhHEHQkmXN3JHaW-BWQ';

const loginCard = document.getElementById('loginCard');
const dashboard = document.getElementById('dashboard');
const passwordInput = document.getElementById('passwordInput');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const ordersList = document.getElementById('ordersList');

const money = v => 'R$ ' + Number(v).toFixed(2).replace('.', ',');

function statusLabel(status){
  return { paid: 'Pago', pending: 'Pendente', failed: 'Falhou' }[status] || status;
}

function formatDate(iso){
  const d = new Date(iso);
  return d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
}

async function fetchOrders(password){
  const res = await fetch(FUNCTION_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${ANON_KEY}`,
      'apikey': ANON_KEY
    },
    body: JSON.stringify({ password })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Erro ao entrar.');
  return data.orders;
}

function renderOrders(orders){
  if (!orders || orders.length === 0){
    ordersList.innerHTML = '<div class="empty">Nenhum pedido ainda.</div>';
    return;
  }
  ordersList.innerHTML = orders.map(o => {
    const items = Array.isArray(o.items) ? o.items : [];
    const itemsHtml = items.map(item => `
      <li>${item.name}${item.duration ? ' — ' + item.duration : ''}${item.intensity ? ' · ' + item.intensity : ''}${item.creme ? ' · com creme' : ''} — ${money(item.price)}</li>
    `).join('');

    return `
      <div class="order-card">
        <div class="order-top">
          <div>
            <div class="order-name">${o.customer_name}</div>
            <span class="badge ${o.status}">${statusLabel(o.status)}</span>
          </div>
          <div class="order-total">${money(o.total)}</div>
        </div>
        <div class="order-meta">
          <div><b>Telefone:</b> ${o.customer_phone}</div>
          <div><b>Horário:</b> ${o.customer_time || 'não informado'}</div>
          <div><b>Local:</b> ${o.customer_location || 'não informado'}</div>
          <div><b>Observações:</b> ${o.customer_notes || 'nenhuma'}</div>
          <div><b>Criado em:</b> ${formatDate(o.created_at)}</div>
        </div>
        <ul class="order-items">${itemsHtml}</ul>
      </div>
    `;
  }).join('');
}

async function doLogin(password){
  loginError.textContent = '';
  loginBtn.disabled = true;
  loginBtn.textContent = 'Entrando...';
  try {
    const orders = await fetchOrders(password);
    sessionStorage.setItem('lumenno-admin-pw', password);
    loginCard.style.display = 'none';
    dashboard.style.display = 'block';
    renderOrders(orders);
  } catch (err) {
    loginError.textContent = err.message || 'Senha incorreta.';
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = 'Entrar';
  }
}

loginBtn.addEventListener('click', () => doLogin(passwordInput.value));
passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(passwordInput.value); });

document.getElementById('refreshBtn').addEventListener('click', async () => {
  const pw = sessionStorage.getItem('lumenno-admin-pw');
  if (!pw) return;
  const orders = await fetchOrders(pw);
  renderOrders(orders);
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem('lumenno-admin-pw');
  dashboard.style.display = 'none';
  loginCard.style.display = 'block';
  passwordInput.value = '';
});

// Se já tiver senha salva nessa aba, entra direto
const savedPw = sessionStorage.getItem('lumenno-admin-pw');
if (savedPw){
  doLogin(savedPw);
}
</script>

</body>
</html>
